<div class="backdrop" (click)="handleNewTaskDialogClose()"></div>
<dialog open>
    <h2>Add Task</h2>
    <form (ngSubmit)="handleNewTaskAddition()">
        <p>
            <label for="title">Title</label>
            <input type="text" id="title" name="title" [(ngModel)]="enteredTitle" />
        </p>

        <p>
            <label for="summary">Summary</label>
            <textarea id="summary" rows="5" name="summary" [(ngModel)]="enteredSummary"></textarea>
        </p>

        <p>
            <label for="due-date">Due Date</label>
            <input type="date" id="due-date" name="due-date" [(ngModel)]="enteredDate" />
        </p>

        <p class="actions">
            <button type="button" (click)="handleNewTaskDialogClose()">Cancel</button>
            <button type="submit" (click)="handleNewTaskAddition()">Create</button>
        </p>
    </form>
</dialog>
